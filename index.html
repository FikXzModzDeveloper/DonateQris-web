<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Donate | FikXzMods</title>
  <link rel="icon" href="https://files.catbox.moe/xfxo77.jpg" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <button class="sound-btn" onclick="playSound()">
      <i class="fas fa-volume-high"></i>
    </button>
    <audio id="bgSound" src="https://files.catbox.moe/o4hs8o.mp3"></audio>

    <div class="logo">
      <i class="fas fa-qrcode logo-icon"></i>
      <span class="logo-text">Donate | Fmds</span>
    </div>

    <form id="donateForm">
      <div class="form-group">
        <label class="form-label">Nominal</label>
        <input type="number" id="nominal" class="form-control" placeholder="Masukkan nominal" required>
      </div>
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-paper-plane"></i> Submit
      </button>
    </form>

    <div id="qrisResult" class="qris-box" style="display:none;">
      <img id="qrisImage" class="qris-img" alt="QRIS">
      <div class="info-box">
        <strong>Merchant:</strong> <span id="merchantName"></span><br>
        <strong>Nominal:</strong> Rp <span id="amount"></span>
      </div>
    </div>

    <div class="footer">
      Qris donate Powered By FikXzMods
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
